name = "fast-proof-theory"
version = "0.1.0"
srcDir = "lean_backend"
defaultTargets = ["fast-proof-theory"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.0"

[[lean_lib]]
name = "FastProofTheory"

[[lean_lib]]
name = "FastProofTheoryLogic"

[[lean_lib]]
name = "FastProofTheoryBackend"

[[lean_exe]]
name = "fast-proof-theory"
root = "Main"

[[lean_exe]]
name = "mypa-lean-kernel"
root = "LeanKernelMain"

[[lean_exe]]
name = "mypa-check"
root = "MypaCheckMain"

[[lean_exe]]
name = "mypa-export"
root = "MypaExportMain"

[[lean_exe]]
name = "mypa-export-cache"
root = "MypaExportCacheMain"
