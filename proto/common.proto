syntax = "proto3";

package prover;

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_ERROR = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_INFORMATION = 3;
  SEVERITY_HINT = 4;
}

message Position {
  uint32 line = 1;
  uint32 character = 2;
}

message Range {
  Position start = 1;
  Position end = 2;
}

message Diagnostic {
  Range range = 1;
  Severity severity = 2;
  string code = 3;
  string source = 4;
  string message = 5;
}
