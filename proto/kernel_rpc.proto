syntax = "proto3";

package prover;

import "common.proto";
import "document_ir.proto";

message GoalHypothesis {
  string name = 1;
  string type = 2;
}

message GoalView {
  string id = 1;
  repeated GoalHypothesis hypotheses = 2;
  string target = 3;
}

message CheckRequest {
  string request_id = 1;
  DocumentIR document = 2;
}

message CheckResponse {
  string request_id = 1;
  repeated Diagnostic diagnostics = 2;
  repeated GoalView goals = 3;
}
